services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    command: ["node", "dist/main.js", "--mode=all"]

  worker:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    command: ["node", "dist/main.js", "--mode=worker"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru

volumes:
  redis-data:
