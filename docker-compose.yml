services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}
      - TARGET_GROUP=${TARGET_GROUP:-taxesnomadspain}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-google}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - DATABASE_PATH=/app/data/knowledge.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
